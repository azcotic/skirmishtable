<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkirmishTable</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&family=JetBrains+Mono:wght@400;600&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<!-- Los textos visibles salen de src/i18n/es.js (data-t, data-t-title, data-t-aria; ver src/i18n/aplicar.js) -->

<div class="app">
<header>
  <h1>Skirmish<span>Table</span></h1>
  <span class="hint" id="hint" data-t="ayuda.inicio"></span>
  <button id="panelbtn" class="mini" aria-controls="sidepanel" aria-expanded="false" data-t="app.mostrarPanel" data-t-title="app.panelTitulo"></button>
  <button id="optionsbtn" class="mini" data-t="app.opciones" data-t-title="app.opcionesTitulo"></button>
</header>

<dialog id="options" aria-labelledby="optionstitle">
  <h2 id="optionstitle" data-t="app.opciones"></h2>
  <div id="optionrows"></div>
  <div class="btnrow"><button id="optionsclose" class="mini" data-t="app.hecho"></button></div>
</dialog>

<div class="main">
  <div class="boardwrap">
    <div class="viewbar">
      <button id="view3d" class="mini active" data-t="vista.mesa3d" data-t-title="vista.mesa3dTitulo"></button>
      <button id="view2d" class="mini" data-t="vista.mapa2d" data-t-title="vista.mapa2dTitulo"></button>
      <button id="view3dtop" class="mini" style="display:none" data-t="vista.cenital" data-t-title="vista.cenitalTitulo"></button>
      <span id="ringpick" class="ringpick" style="display:none" data-t-title="anillos.titulo">
        <label><span data-t="anillos.apostado"></span> <select id="ringready"></select></label>
        <label><span data-t="anillos.activo"></span> <select id="ringactive"></select></label>
      </span>
      <span id="threatpick" class="ringpick" data-t-title="amenazas.titulo">
        <label><span data-t="amenazas.nombre"></span> <select id="threatstyle"></select></label>
        <label data-t-title="amenazas.zonasTitulo"><span data-t="amenazas.zonas"></span> <select id="threatstrength"></select></label>
        <label data-t-title="amenazas.rutasTitulo"><span data-t="amenazas.rutas"></span> <select id="threatpaths"></select></label>
        <span class="threatkey" id="threatkey"><i class="ch"></i><span data-t="amenazas.leyendaCarga"></span> <i class="cl"></i><span data-t="amenazas.leyendaSinCobertura"></span></span>
      </span>
      <span class="foldonly">
        <button class="mini" data-press="endtp" data-t="bandeja.finPI" data-t-title="bandeja.finPITitulo"></button>
        <button class="mini" data-press="undo" data-t="bandeja.deshacer" data-t-title="bandeja.deshacerTitulo"></button>
        <button class="mini" data-press="rulerbtn" data-t="bandeja.regla" data-t-title="bandeja.reglaTitulo"></button>
      </span>
      <span class="hint" id="v3dnote"></span>
      <button id="loadtts" class="mini" style="display:none" data-t="vista.descargarSteam" data-t-title="vista.descargarSteamTitulo"></button>
    </div>
    <div id="replaybar" class="replaybar" hidden></div>
    <div class="stage">
      <svg id="board" viewBox="0 0 960 704" data-t-aria="mesa.tablero"></svg>
      <div id="board3d"></div>
      <div class="hud hudtop" id="hudtop" data-t-aria="mesa.agentes"></div>
      <div class="hud hudbot" id="hudbot"></div>
      <div class="hudsheet" id="hudsheet" hidden></div>
      <div class="hudtip" id="hudtip" role="tooltip" hidden></div>
      <!-- each side's status cards on its own edge of the table (src/ui/statuscards.js) -->
      <div class="scards s0" id="scards0" data-t-equipo="0" data-t-aria="mesa.tarjetas"></div>
      <div class="scards s1" id="scards1" data-t-equipo="1" data-t-aria="mesa.tarjetas"></div>
      <!-- a dice box per side, behind a die icon in the bottom corners of the table (src/ui/dicebox.js) -->
      <div class="dicedock s0" id="dicedock0" data-t-equipo="0">
        <button class="diceicon" data-t-title="mesa.cajaDados" data-t-aria="mesa.cajaDados" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg><span class="dicebadge"></span></button>
      </div>
      <div class="dicedock s1" id="dicedock1" data-t-equipo="1">
        <button class="diceicon" data-t-title="mesa.cajaDados" data-t-aria="mesa.cajaDados" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="8" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="8" cy="16" r="1.6"/><circle cx="16" cy="16" r="1.6"/></svg><span class="dicebadge"></span></button>
      </div>
    </div>
  </div>

  <aside id="sidepanel">
    <div class="panel">
      <h2 data-t="bandeja.titulo"></h2>
      <div class="tray">
        <div class="cell"><div class="v" id="tpv">1</div><div class="k" data-t="bandeja.puntoInflexion"></div></div>
        <div class="cell"><div class="v teamA" id="cpa">3</div><div class="k" data-t-equipo="0" data-t="bandeja.pm"></div></div>
        <div class="cell"><div class="v teamB" id="cpb">3</div><div class="k" data-t-equipo="1" data-t="bandeja.pm"></div></div>
        <div class="cell"><div class="v teamA" id="vpa">0</div><div class="k" data-t-equipo="0" data-t="bandeja.pv"></div></div>
        <div class="cell"><div class="v teamB" id="vpb">0</div><div class="k" data-t-equipo="1" data-t="bandeja.pv"></div></div>
        <button class="mini" id="endtp" data-t="bandeja.finPI" data-t-title="bandeja.finPITitulo"></button>
        <button class="mini" id="undo" data-t="bandeja.deshacer" data-t-title="bandeja.deshacerTitulo"></button>
        <button class="mini" id="reset" data-t="bandeja.reiniciar"></button>
        <button class="mini" id="rulerbtn" data-t="bandeja.regla" data-t-title="bandeja.reglaTitulo"></button>
      </div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.operaciones"></h2>
      <div id="opsbox"></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.enLinea"></h2>
      <div id="netbox"></div>
      <div id="sharebox"></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.grabacion"></h2>
      <div id="replaybox"></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.reglas"></h2>
      <div class="btnrow" id="rulebtns"></div>
      <div class="hint" id="rulenote"></div>
    </div>

    <div class="panel">
      <h2><span data-t="paneles.zona"></span> <span class="tag" id="buildtag" style="margin-left:6px;letter-spacing:.06em" data-t="zona.version" data-t-title="zona.versionTitulo"></span></h2>
      <div id="mapbtns"></div>
      <div class="btnrow">
        <button class="mini" id="importbtn" data-t="zona.importar" data-t-title="zona.importarTitulo"></button>
        <input type="file" id="importfile" style="display:none">
      </div>
      <div class="hint" id="mapnote"></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.miniaturas"></h2>
      <div id="minis"></div>
    </div>

    <div class="panel" id="oppanel">
      <h2 data-t="paneles.agente"></h2>
      <div id="opcard"><span class="hint" data-t="ficha.vacia"></span></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.blancos"></h2>
      <div id="shots"><span class="hint" data-t="blancos.ayuda"></span></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.veredicto"></h2>
      <div id="verdict"><span class="hint" data-t="veredicto.ayuda"></span></div>
    </div>

    <div class="panel">
      <h2 data-t="paneles.registro"></h2>
      <div id="log"></div>
    </div>
  </aside>
</div>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
